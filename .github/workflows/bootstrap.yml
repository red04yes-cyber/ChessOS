name: Bootstrap, verify and package Chess OS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Reconstruct source archive (fail closed)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $parts = @(
            "chessos-source-0.7.0.tar.gz.b64.part1",
            "chessos-source-0.7.0.tar.gz.b64.part2",
            "chessos-source-0.7.0.tar.gz.b64.part3",
            "chessos-source-0.7.0.tar.gz.b64.part4",
            "chessos-source-0.7.0.tar.gz.b64.part5",
            "chessos-source-0.7.0.tar.gz.b64.part6",
            "chessos-source-0.7.0.tar.gz.b64.part7"
          )

          $missing = @($parts | Where-Object { -not (Test-Path -LiteralPath $_ -PathType Leaf) })
          if ($missing.Count -gt 0) {
            throw ("Source bundle is incomplete. Missing: " + ($missing -join ", ") + ". Add all seven archive parts to the repository before building.")
          }

          $encoded = ($parts | ForEach-Object { (Get-Content -LiteralPath $_ -Raw).Trim() }) -join ""
          $archive = Join-Path $env:RUNNER_TEMP "chessos-source-0.7.0.tar.gz"
          $extract = Join-Path $env:RUNNER_TEMP "chessos-source"
          [IO.File]::WriteAllBytes($archive, [Convert]::FromBase64String($encoded))
          New-Item -ItemType Directory -Force -Path $extract | Out-Null

          tar -tzf $archive | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Source archive is not a valid gzip tar archive." }
          tar -xzf $archive -C $extract
          if ($LASTEXITCODE -ne 0) { throw "Could not extract the source archive." }

          if (-not (Test-Path (Join-Path $extract "package.json")) -or
              -not (Test-Path (Join-Path $extract "package-lock.json")) -or
              -not (Test-Path (Join-Path $extract "src-tauri/Cargo.toml"))) {
            throw "Archive must contain package.json, package-lock.json and src-tauri/Cargo.toml at its root."
          }

          Get-ChildItem -LiteralPath $extract -Force |
            Where-Object { $_.Name -notin @(".git", ".github") } |
            Copy-Item -Destination $env:GITHUB_WORKSPACE -Recurse -Force

          if (-not (Test-Path "package.json") -or
              -not (Test-Path "package-lock.json") -or
              -not (Test-Path "src-tauri/Cargo.toml")) {
            throw "Source reconstruction did not produce the expected project files."
          }

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify dependencies and Stockfish assets
        run: |
          npm ls chess.js ts-fsrs stockfish react react-dom
          npm run verify:stockfish

      - name: Type-check
        run: npm run typecheck

      - name: Unit and migration tests
        run: |
          npm test
          npm run verify:schema

      - name: Browser engine test
        run: |
          npx playwright install chromium
          npm run build
          npm run smoke:engine

      - name: Build Windows installer
        run: npm run tauri:build -- --bundles nsis

      - name: Smoke test desktop executable
        shell: pwsh
        run: ./scripts/smoke-windows-exe.ps1

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chess-os-windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
