name: Chess OS verification and Windows installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chess-os-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Frontend tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run chess logic tests
        run: npm test
      - name: Build frontend
        run: npm run build

  windows-installer:
    name: Windows NSIS installer
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install stable Rust toolchain and MSVC target
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run chess logic tests
        run: npm test
      - name: Build frontend for Tauri metadata
        run: npm run build
      - name: Run SQLite backend tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Test clean install, app launch, 0.1.x upgrade and SQLite preservation
        shell: pwsh
        run: ./scripts/windows-installer-smoke.ps1
      - name: Build signed updater bundle for approved releases
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri:build -- --config src-tauri/tauri.release.conf.json
      - name: Generate installer SHA-256 checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -File | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer not found for checksum." }
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path ($installer.FullName + ".sha256") -Value "$hash *$($installer.Name)" -NoNewline -Encoding ASCII
      - name: Upload NSIS installer and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chess-os-windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sha256
          if-no-files-found: error
          retention-days: 90
      - name: Upload signed updater bundle
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chess-os-windows-updater
          path: |
            src-tauri/target/release/bundle/nsis/*.nsis.zip
            src-tauri/target/release/bundle/nsis/*.nsis.zip.sig
          if-no-files-found: error
          retention-days: 90

  publish-release:
    name: Publish tagged GitHub Release
    runs-on: ubuntu-latest
    needs: [verify, windows-installer]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download verified installer artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --name chess-os-windows-installer --dir release-assets
      - name: Download signed updater artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --name chess-os-windows-updater --dir release-assets
      - name: Verify release asset checksum
        shell: bash
        run: |
          installer="$(find release-assets -type f -name '*.exe' -print -quit)"
          checksum="$(find release-assets -type f -name '*.sha256' -print -quit)"
          test -n "$installer" && test -n "$checksum"
          expected="$(awk '{print $1}' "$checksum")"
          actual="$(sha256sum "$installer" | awk '{print $1}')"
          test "$expected" = "$actual"
          echo "INSTALLER_ASSET=$installer" >> "$GITHUB_ENV"
          echo "CHECKSUM_ASSET=$checksum" >> "$GITHUB_ENV"
      - name: Create updater manifest
        shell: bash
        run: |
          bundle="$(find release-assets -type f -name '*.nsis.zip' -print -quit)"
          signature_file="${bundle}.sig"
          test -n "$bundle" && test -f "$signature_file"
          export UPDATER_BUNDLE="$bundle"
          export UPDATER_SIGNATURE_FILE="$signature_file"
          export RELEASE_TAG="$GITHUB_REF_NAME"
          python3 - <<'PY'
          import json, os, pathlib, urllib.parse, datetime
          bundle = pathlib.Path(os.environ['UPDATER_BUNDLE'])
          signature = pathlib.Path(os.environ['UPDATER_SIGNATURE_FILE']).read_text(encoding='utf-8').strip()
          asset = urllib.parse.quote(bundle.name, safe='')
          url = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{os.environ['RELEASE_TAG']}/{asset}"
          manifest = {
              'version': os.environ['RELEASE_TAG'].removeprefix('v'),
              'notes': pathlib.Path(f"docs/releases/{os.environ['RELEASE_TAG']}.md").read_text(encoding='utf-8'),
              'pub_date': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'platforms': {'windows-x86_64': {'signature': signature, 'url': url}},
          }
          pathlib.Path('latest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Publish GitHub Release with installer, checksum and updater
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bundle="$(find release-assets -type f -name '*.nsis.zip' -print -quit)"
          signature="${bundle}.sig"
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Chess OS $GITHUB_REF_NAME" --notes-file "docs/releases/$GITHUB_REF_NAME.md" "$INSTALLER_ASSET" "$CHECKSUM_ASSET" "$bundle" "$signature" latest.json
