name: Chess OS verification and Windows installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chess-os-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lockfiles:
    name: Resolve and publish dependency lockfiles
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
      - name: Generate missing lockfiles without running package scripts
        shell: bash
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          fi
          if [ ! -f src-tauri/Cargo.lock ]; then
            cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
          fi
          test -s package-lock.json
          test -s src-tauri/Cargo.lock
      - name: Upload dependency lockfiles for reproducible downstream jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chess-os-dependency-locks
          path: |
            package-lock.json
            src-tauri/Cargo.lock
          if-no-files-found: error
          retention-days: 3

  bootstrap-maintenance:
    name: One-time dependency lock and Rust formatting commit
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'quality/reproducible-builds-accessibility'
    runs-on: ubuntu-latest
    needs: [lockfiles]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: chess-os-dependency-locks
          path: .
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
      - name: Format Rust, commit lockfiles, and dispatch clean verification
        shell: bash
        env:
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cargo fmt --manifest-path src-tauri/Cargo.toml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json src-tauri/Cargo.lock src-tauri/build.rs src-tauri/src/*.rs
          if git diff --cached --quiet; then
            echo "No bootstrap changes to commit."
            exit 0
          fi
          git commit -m "chore: lock dependencies and format Rust sources"
          git push origin "HEAD:${PR_BRANCH}"

  verify:
    name: Frontend tests and production build
    runs-on: ubuntu-latest
    needs: [lockfiles]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: chess-os-dependency-locks
          path: .
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install exact Node dependency graph
        run: npm ci --no-audit --no-fund
      - name: Run chess logic and security tests
        run: npm test
      - name: Build frontend
        run: npm run build

  dependency-audit:
    name: npm and Rust dependency security audit
    runs-on: ubuntu-latest
    needs: [lockfiles]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: chess-os-dependency-locks
          path: .
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install exact Node dependency graph
        run: npm ci --no-audit --no-fund
      - name: Audit npm dependencies
        run: npm audit --audit-level=high
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit Rust dependencies
        run: cargo audit --file src-tauri/Cargo.lock

  browser-e2e:
    name: Browser end-to-end and accessibility smoke tests
    runs-on: ubuntu-latest
    needs: [lockfiles]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: chess-os-dependency-locks
          path: .
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
      - name: Install exact Node dependency graph
        run: npm ci --no-audit --no-fund
      - name: Install pinned Playwright test runtime
        run: python -m pip install --disable-pip-version-check -r tests/e2e/requirements.txt
      - name: Install Chromium for browser tests
        run: python -m playwright install --with-deps chromium
      - name: Run browser end-to-end tests
        run: npm run test:e2e

  windows-installer:
    name: Windows NSIS installer
    runs-on: windows-latest
    needs: [lockfiles]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: chess-os-dependency-locks
          path: .
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install stable Rust toolchain and MSVC target
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - name: Install Rust formatting and lint components
        run: rustup component add rustfmt clippy
      - name: Install exact Node dependency graph
        run: npm ci --no-audit --no-fund
      - name: Run chess logic and security tests
        run: npm test
      - name: Build frontend for Tauri metadata
        run: npm run build
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Run Rust Clippy with warnings denied
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
      - name: Run SQLite backend tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Test clean install, app launch, 0.1.x upgrade and SQLite preservation
        shell: pwsh
        run: ./scripts/windows-installer-smoke.ps1
      - name: Generate installer SHA-256 checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -File | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer not found for checksum." }
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path ($installer.FullName + ".sha256") -Value "$hash *$($installer.Name)" -NoNewline -Encoding ASCII
      - name: Upload NSIS installer and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chess-os-windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sha256
          if-no-files-found: error
          retention-days: 90

  publish-release:
    name: Publish tagged GitHub Release
    runs-on: ubuntu-latest
    needs: [verify, dependency-audit, browser-e2e, windows-installer]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download verified installer artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --name chess-os-windows-installer --dir release-assets
      - name: Verify release asset checksum
        shell: bash
        run: |
          installer="$(find release-assets -type f -name '*.exe' -print -quit)"
          checksum="$(find release-assets -type f -name '*.sha256' -print -quit)"
          test -n "$installer" && test -n "$checksum"
          expected="$(awk '{print $1}' "$checksum")"
          actual="$(sha256sum "$installer" | awk '{print $1}')"
          test "$expected" = "$actual"
          echo "INSTALLER_ASSET=$installer" >> "$GITHUB_ENV"
          echo "CHECKSUM_ASSET=$checksum" >> "$GITHUB_ENV"
      - name: Publish GitHub Release with notes, installer and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Chess OS $GITHUB_REF_NAME" --notes-file "docs/releases/$GITHUB_REF_NAME.md" "$INSTALLER_ASSET" "$CHECKSUM_ASSET"
