name: Chess OS verification and Windows installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_confirmation:
        description: "Per pubblicare il tag selezionato, digita esattamente PUBBLICA seguito dal tag (es. PUBBLICA v0.2.0)."
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: chess-os-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Frontend tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run chess logic tests
        run: npm test
      - name: Build frontend
        run: npm run build

  windows-installer:
    name: Windows NSIS installer
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install stable Rust toolchain and MSVC target
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run chess logic tests
        run: npm test
      - name: Build frontend for Tauri metadata
        run: npm run build
      - name: Run SQLite backend tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Test clean install, app launch, 0.1.x upgrade and SQLite preservation
        shell: pwsh
        run: ./scripts/windows-installer-smoke.ps1
      - name: Build signed updater package for an explicitly approved release
        if: >-
          github.event_name == 'workflow_dispatch' &&
          startsWith(github.ref, 'refs/tags/v') &&
          inputs.release_confirmation == format('PUBBLICA {0}', github.ref_name)
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "GitHub Actions secret TAURI_SIGNING_PRIVATE_KEY is missing."
          }
          $releaseConfig = Get-Content -Raw "src-tauri/tauri.release.conf.json" | ConvertFrom-Json
          if ($releaseConfig.plugins.updater.pubkey -match '^REPLACE_') {
            throw "Set the Tauri updater public key in src-tauri/tauri.release.conf.json before publishing."
          }
          if (-not (Test-Path "docs/releases/$env:GITHUB_REF_NAME.md")) {
            throw "Release notes file docs/releases/$env:GITHUB_REF_NAME.md is missing."
          }
          $expectedVersion = $env:GITHUB_REF_NAME.Substring(1)
          $packageVersion = (Get-Content -Raw "package.json" | ConvertFrom-Json).version
          $tauriVersion = (Get-Content -Raw "src-tauri/tauri.conf.json" | ConvertFrom-Json).version
          $cargoVersion = [regex]::Match((Get-Content -Raw "src-tauri/Cargo.toml"), '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
          if ($packageVersion -ne $expectedVersion -or $tauriVersion -ne $expectedVersion -or $cargoVersion -ne $expectedVersion) {
            throw "Release tag $expectedVersion must match package.json ($packageVersion), tauri.conf.json ($tauriVersion) and Cargo.toml ($cargoVersion)."
          }
          npm run tauri:build -- --config src-tauri/tauri.release.conf.json
      - name: Generate installer and updater SHA-256 checksums
        shell: pwsh
        run: |
          $bundleDir = "src-tauri/target/release/bundle/nsis"
          $files = @(
            Get-ChildItem -Path $bundleDir -Filter "*.exe" -File
            Get-ChildItem -Path $bundleDir -Filter "*.nsis.zip" -File
          )
          if (-not ($files | Where-Object { $_.Extension -eq ".exe" })) {
            throw "NSIS installer not found for checksum."
          }
          foreach ($file in $files) {
            $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            Set-Content -Path ($file.FullName + ".sha256") -Value "$hash *$($file.Name)" -NoNewline -Encoding ASCII
          }
      - name: Upload NSIS installer and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chess-os-windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/nsis/*.exe.sha256
            src-tauri/target/release/bundle/nsis/*.nsis.zip
            src-tauri/target/release/bundle/nsis/*.nsis.zip.sig
            src-tauri/target/release/bundle/nsis/*.nsis.zip.sha256
          if-no-files-found: error
          retention-days: 90

  publish-release:
    name: Publish tagged GitHub Release
    runs-on: ubuntu-latest
    needs: [verify, windows-installer]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      startsWith(github.ref, 'refs/tags/v') &&
      inputs.release_confirmation == format('PUBBLICA {0}', github.ref_name)
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download verified installer artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --name chess-os-windows-installer --dir release-assets
      - name: Verify installer and signed updater assets; generate latest.json
        shell: bash
        run: |
          notes="docs/releases/$GITHUB_REF_NAME.md"
          installer="$(find release-assets -type f -name '*.exe' -print -quit)"
          installer_checksum="${installer}.sha256"
          update_bundle="$(find release-assets -type f -name '*.nsis.zip' -print -quit)"
          update_signature="${update_bundle}.sig"
          update_checksum="${update_bundle}.sha256"
          test -f "$notes"
          test -n "$installer" && test -f "$installer_checksum"
          test -n "$update_bundle" && test -f "$update_signature" && test -f "$update_checksum"
          expected="$(awk '{print $1}' "$installer_checksum")"
          actual="$(sha256sum "$installer" | awk '{print $1}')"
          test "$expected" = "$actual"
          expected_update="$(awk '{print $1}' "$update_checksum")"
          actual_update="$(sha256sum "$update_bundle" | awk '{print $1}')"
          test "$expected_update" = "$actual_update"
          signature="$(cat "$update_signature")"
          update_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$(basename "$update_bundle")"
          jq -n \
            --arg version "${GITHUB_REF_NAME#v}" \
            --arg notes "$(cat "$notes")" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg url "$update_url" \
            --arg signature "$signature" \
            '{version:$version,pub_date:$pub_date,notes:$notes,platforms:{"windows-x86_64":{url:$url,signature:$signature}}}' \
            > release-assets/latest.json
          echo "INSTALLER_ASSET=$installer" >> "$GITHUB_ENV"
          echo "CHECKSUM_ASSET=$installer_checksum" >> "$GITHUB_ENV"
          echo "UPDATE_BUNDLE=$update_bundle" >> "$GITHUB_ENV"
          echo "UPDATE_SIGNATURE=$update_signature" >> "$GITHUB_ENV"
          echo "UPDATE_CHECKSUM=$update_checksum" >> "$GITHUB_ENV"
          echo "UPDATE_MANIFEST=release-assets/latest.json" >> "$GITHUB_ENV"
      - name: Publish GitHub Release with installer, signature, update bundle and manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Chess OS $GITHUB_REF_NAME" --notes-file "docs/releases/$GITHUB_REF_NAME.md" \
            "$INSTALLER_ASSET" "$CHECKSUM_ASSET" "$UPDATE_BUNDLE" "$UPDATE_SIGNATURE" "$UPDATE_CHECKSUM" "$UPDATE_MANIFEST"
